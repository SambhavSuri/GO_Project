<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>VRM Model Test - Animation Display</title>
    <style>
        body { 
            margin: 0; 
            background: #000;
            font-family: Arial, sans-serif;
        }
        canvas { display: block; }
        
        /* Animation status overlay */
        .status-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
            border: 1px solid #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }
        
        .status-item {
            margin: 5px 0;
        }
        
        .connected { color: #00ff00; }
        .disconnected { color: #ff0000; }
        .thinking { color: #ffaa00; }
        .speaking { color: #00aaff; }
        .idle { color: #aaaaaa; }
    </style>
</head>
<body>
    <canvas class="webgl"></canvas>
    
    <!-- Status overlay -->
    <div class="status-overlay">
        <div class="status-item">🎭 <strong>VRM Animation Display</strong></div>
        <div class="status-item">📡 Connection: <span id="connection-status" class="disconnected">Disconnected</span></div>
        <div class="status-item">🎬 Animation: <span id="animation-status" class="idle">Idle</span></div>
        <div class="status-item">💬 Send messages on <a href="/" target="_blank" style="color: #00aaff;">main page</a> to trigger animations</div>
    </div>
    
    <!-- Manual test controls -->
    <div class="status-overlay" style="top: 20px; right: 20px; left: auto;">
        <div class="status-item"><strong>🧪 Manual Tests</strong></div>
                    <button onclick="startCall()" style="margin: 5px; padding: 8px; background: #333; color: #00ff88; border: 1px solid #00ff88; border-radius: 4px; cursor: pointer;">📞 Start Call (Wave + Facial)</button><br>
        <button onclick="testTalking()" style="margin: 5px; padding: 8px; background: #333; color: #00aaff; border: 1px solid #00aaff; border-radius: 4px; cursor: pointer;">🔄 Toggle Body Animation</button><br>
        <button onclick="testFacialSpeaking()" style="margin: 5px; padding: 8px; background: #333; color: #ff6600; border: 1px solid #ff6600; border-radius: 4px; cursor: pointer;">👄 Test Facial Speaking</button><br>
        <button onclick="testIdle()" style="margin: 5px; padding: 8px; background: #333; color: #aaaaaa; border: 1px solid #aaaaaa; border-radius: 4px; cursor: pointer;">😴 Test Idle</button>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script>
        // Polyfill for Node.js process object
        window.process = { env: {} };
        
        // WebSocket connection for animation events
        let socket;
        
        function initializeWebSocket() {
            socket = io();
            
            const connectionStatus = document.getElementById('connection-status');
            const animationStatus = document.getElementById('animation-status');
            
            socket.on('connect', () => {
                console.log('🔗 Connected to animation server');
                connectionStatus.textContent = 'Connected';
                connectionStatus.className = 'connected';
            });
            
            socket.on('disconnect', () => {
                console.log('❌ Disconnected from animation server');
                connectionStatus.textContent = 'Disconnected';
                connectionStatus.className = 'disconnected';
            });
            
            // Debug: Log all incoming events
            socket.onAny((event, ...args) => {
                console.log('📡 WebSocket event received:', event, args);
            });
            
            // Animation event handlers
            socket.on('thinking_started', (data) => {
                console.log('🤔 AI started thinking - switching to thinking animation', data);
                animationStatus.textContent = 'Thinking...';
                animationStatus.className = 'thinking';
                
                // Trigger thinking animation
                console.log('switchToThinking available:', typeof window.switchToThinking);
                if (window.switchToThinking) {
                    console.log('Calling switchToThinking...');
                    window.switchToThinking();
                } else {
                    console.warn('❌ switchToThinking not available');
                }
            });
            
            socket.on('tts_started', (data) => {
                console.log('🎤 TTS started - switching to talking animation', data);
                animationStatus.textContent = 'Speaking';
                animationStatus.className = 'speaking';
                
                // Trigger talking animation with expressions
                console.log('Speaking functions available:', {
                    startSynchronizedSpeaking: typeof window.startSynchronizedSpeaking,
                    startSpeaking: typeof window.startSpeaking
                });
                
                if (window.startSynchronizedSpeaking) {
                    console.log('Calling startSynchronizedSpeaking...');
                    window.startSynchronizedSpeaking();
                } else if (window.startSpeaking) {
                    console.log('Calling startSpeaking...');
                    window.startSpeaking();
                } else {
                    console.warn('❌ No speaking functions available');
                }
            });
            
            socket.on('tts_ended', (data) => {
                console.log('🔇 TTS ended - returning to idle animation', data);
                animationStatus.textContent = 'Idle';
                animationStatus.className = 'idle';
                
                // Return to idle animation
                console.log('stopSpeaking available:', typeof window.stopSpeaking);
                if (window.stopSpeaking) {
                    console.log('Calling stopSpeaking...');
                    window.stopSpeaking();
                } else {
                    console.warn('❌ stopSpeaking not available');
                }
            });
            
            socket.on('vrm_ready', () => {
                console.log('✅ VRM model ready for animations');
            });
            
            // Notify server that VRM is ready
            setTimeout(() => {
                socket.emit('vrm_ready');
            }, 2000);
        }
        
        // Initialize WebSocket connection after a short delay
        setTimeout(() => {
            initializeWebSocket();
        }, 1000);
        
        // Manual test functions
        function startCall() {
            console.log('📞 Starting call - Playing waving animation first, then Riley introduction with facial expressions only');
            document.getElementById('animation-status').textContent = 'Riley Greeting...';
            document.getElementById('animation-status').className = 'speaking';
            
            // First play waving animation with smile, then return to idle and prepare for speech
            if (window.playAnimationOnceSmooth) {
                // Play waving animation with smile expression
                window.playAnimationOnceSmooth('waving', 0.3, () => {
                    console.log('🎬 Waving finished, returning to idle state');
                    
                    // Reset expression to default
                    if (window.setFacialExpression) {
                        window.setFacialExpression('default');
                    }
                    
                    // Return to idle animation to fix hand position
                    if (window.playAnimationSmooth) {
                        window.playAnimationSmooth('idle', 0.3);
                    }
                    
                    // Wait a moment for idle transition, then start TTS
                    setTimeout(() => {
                        console.log('🎬 Now in idle state, starting TTS with facial expressions');
                        document.getElementById('animation-status').textContent = 'Riley Speaking...';
                        
                        // Generate and play TTS audio - facial expressions will start when audio plays
                        generateTTSOnly("Hi, This is riley your Advocate and Assistant. How may I help you today?");
                    }, 500); // Give time for idle transition
                    
                }, 'smile'); // Add smile expression during waving
            } else {
                console.warn('Animation functions not available, playing speech only');
                generateTTSOnly("Hi, This is riley your Advocate and Assistant. How may I help you today?");
            }
        }
        
        // Function to generate TTS without body animations
        async function generateTTSOnly(text, voiceId = 'en-US-terrell') {
            try {
                console.log('🎤 Generating TTS audio only (no body animation):', text);
                
                const response = await fetch('/api/text-to-speech', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: text,
                        voiceId: voiceId
                    })
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    console.log('✅ TTS audio generated successfully:', result.audio);
                    
                    // Create audio element
                    const audio = new Audio(result.audio);
                    audio.volume = 0.7;
                    
                    // Start facial speaking animation when audio actually starts playing
                    audio.onplay = () => {
                        console.log('🎤 TTS audio started playing - now starting facial expressions');
                        if (window.startSpeaking) {
                            window.startSpeaking();
                        }
                    };
                    
                    // When audio ends, stop facial speaking animation
                    audio.onended = () => {
                        console.log('🎬 Speech ended, stopping facial animation');
                        if (window.stopSpeaking) {
                            window.stopSpeaking();
                        }
                        document.getElementById('animation-status').textContent = 'Idle';
                        document.getElementById('animation-status').className = 'idle';
                    };
                    
                    // Handle audio errors
                    audio.onerror = (error) => {
                        console.error('❌ Audio playback error:', error);
                        if (window.stopSpeaking) {
                            window.stopSpeaking();
                        }
                        document.getElementById('animation-status').textContent = 'Error';
                        document.getElementById('animation-status').className = 'idle';
                    };
                    
                    // Play the audio
                    await audio.play();
                    console.log('🎤 TTS audio playback started');
                    
                } else {
                    console.error('❌ Failed to generate TTS:', result.error);
                }
            } catch (error) {
                console.error('❌ Error in generateTTSOnly function:', error);
                if (window.stopSpeaking) {
                    window.stopSpeaking();
                }
            }
        }
        
        function testTalking() {
            console.log('🧪 Manual test: Toggle body talking animation');
            
            if (window.toggleManualTalking) {
                const isNowActive = window.toggleManualTalking();
                
                if (isNowActive) {
                    document.getElementById('animation-status').textContent = 'Body Animation (Active)';
                    document.getElementById('animation-status').className = 'speaking';
                } else {
                    document.getElementById('animation-status').textContent = 'Idle (Animation Stopped)';
                    document.getElementById('animation-status').className = 'idle';
                }
            } else {
                console.warn('toggleManualTalking function not available yet');
            }
        }
        
        function testFacialSpeaking() {
            console.log('🧪 Manual test: Facial speaking animation');
            document.getElementById('animation-status').textContent = 'Facial Speaking (Manual Test)';
            document.getElementById('animation-status').className = 'speaking';
            if (window.startSpeaking) {
                window.startSpeaking();
            } else {
                console.warn('startSpeaking function not available yet');
            }
        }
        
        function testIdle() {
            console.log('🧪 Manual test: Idle animation');
            document.getElementById('animation-status').textContent = 'Idle (Manual Test)';
            document.getElementById('animation-status').className = 'idle';
            if (window.stopSpeaking) {
                window.stopSpeaking();
            } else {
                console.warn('stopSpeaking not available yet');
            }
        }
    </script>
    
    <!-- Load main.js as ES6 module -->
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
